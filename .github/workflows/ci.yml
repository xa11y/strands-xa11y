name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly canary. The dependency floor (strands-agents>=1.0.0) means new users always
    # resolve the latest SDK, so SDK drift should break here before it breaks them.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install hatch
      # The fake accessibility backend makes every branch reachable on a headless runner,
      # so the suite is held at full statement and branch cover rather than a floor that
      # drifts down. `cov` fails the job below 100%.
      - run: hatch run cov

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install hatch
      - name: Check formatting
        run: hatch run format --check
      - run: hatch run lint
      - run: hatch run typecheck

  import-on-every-platform:
    name: Import - ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install .
      - name: Import the tools
        # A headless runner cannot drive a desktop, but it can prove the package imports
        # and that both tool schemas build on every platform we claim to support.
        run: python -c "from strands_xa11y import use_desktop, inspect_desktop; assert use_desktop.tool_spec['inputSchema']"

  # The tests import from src/ via pythonpath, so nothing above would notice a packaging
  # mistake — a module left out of the wheel, or a README that breaks the PyPI render.
  # publish.yml finds those at release time, which is too late to be useful.
  package:
    name: Package
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install hatch twine
      - run: hatch build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Import from the built wheel
        # Installed from the wheel rather than the source tree, so a module missing from
        # the package list fails here instead of on a user's machine.
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "
          from strands_xa11y import use_desktop, inspect_desktop
          from strands_xa11y import _actions, _errors, _refs, _session, _snapshot, models
          assert {'use_desktop', 'inspect_desktop'} == {use_desktop.tool_name, inspect_desktop.tool_name}
          "

  sdk-compat:
    name: Latest SDK compatibility
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install hatch
      - name: Update to the latest SDK and xa11y
        run: |
          hatch run pip install --upgrade strands-agents xa11y
          hatch run pip show strands-agents xa11y
      - run: hatch run typecheck
      - run: hatch run test
